name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -b)
        run: npm run typecheck

      - name: Build (tsc -b && vite build)
        run: npm run build

  backend:
    name: Backend (compileall + unit tests + server smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile all backend modules
        run: python -m compileall backend

      - name: Unit tests (stdlib only, no install required)
        run: python -m unittest discover -s backend/tests -t . -v

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Server import smoke test
        run: python -c "import backend.server; print('backend.server import OK')"
